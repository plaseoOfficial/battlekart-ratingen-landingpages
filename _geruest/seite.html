<!-- ================= EINWILLIGUNG + GOOGLE-ADS-TAG (wie index.html) =================
  Google Consent Mode v2: Standard ist "abgelehnt". gtag.js lädt erst nach Klick auf "Akzeptieren".
  Konto 771-480-0041 "Battlekart Ratingen", Google-Tag AW-18486708769. Labels wie in index.html:
    buchen  = Klick auf einen "Jetzt buchen"-Knopf (alle a.js-book)
    anruf   = Klick auf eine Telefonnummer (alle tel:-Links)
    anfrage = Klick auf "Angebot anfragen" (Firmenformular von BattleKart) -->
<script>
  window.BK_ADS = { id: 'AW-18486708769', buchen: 'rdIgCPrr-qIdEKGUk-9E', anruf: '-xwJCMr59aIdEKGUk-9E', anfrage: '67EsCKnR-KIdEKGUk-9E' };
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied', wait_for_update: 500 });
  window.bkLoadTag = function () {
    if (window.bkTagLoaded) return;
    window.bkTagLoaded = true;
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(BK_ADS.id);
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', BK_ADS.id);
  };
  (function () {
    var c = null; try { c = localStorage.getItem('bk_consent'); } catch (e) {}
    if (c === 'granted') {
      gtag('consent', 'update', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' });
      bkLoadTag();
    }
  })();
</script>

<script>
/* =========================================================
   BattleKart Düsseldorf-Ratingen – Unterseiten
   Wie index.html: Klick-IDs an Buchungslinks, dataLayer, Ads-Conversions, eigener Zähler,
   Header + Buchungsleiste, Öffnungszeiten. Bewusst NICHT: Preisrechner, Preis-Tabs,
   Anlass-Varianten (?anlass=), Hero-Video, Event-Hinweis.
   Der Inhalt kommt frei von Tamy, deshalb prüft jeder Teil, ob seine Elemente da sind.
   ========================================================= */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var seite = location.pathname;   // z. B. "/gutschein/"

  /* ---------- Google-Ads-Klick-IDs & UTMs an die Buchungsseite weiterreichen ---------- */
  var KEEP = ['gclid', 'gbraid', 'wbraid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  var pass = KEEP.filter(function (k) { return q.get(k); });
  if (pass.length) {
    document.querySelectorAll('a.js-book').forEach(function (a) {
      try {
        var u = new URL(a.href);
        pass.forEach(function (k) { u.searchParams.set(k, q.get(k)); });
        a.href = u.toString();
      } catch (e) {}
    });
  }

  /* ---------- Klick-Events in den dataLayer (welcher Knopf, welche Seite) ---------- */
  window.dataLayer = window.dataLayer || [];
  document.querySelectorAll('.js-track').forEach(function (a) {
    a.addEventListener('click', function () {
      window.dataLayer.push({ event: 'lp_cta_click', lp_cta: a.dataset.cta || '', lp_seite: seite });
    });
  });

  /* ---------- Google-Ads-Conversions (nur mit Einwilligung und eingetragenem Label, siehe BK_ADS oben) ---------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || !window.bkTagLoaded || !window.BK_ADS) return;
    var href = a.getAttribute('href') || '', art = null;
    if (a.classList.contains('js-book')) art = 'buchen';
    else if (href.indexOf('tel:') === 0) art = 'anruf';
    else if (href.indexOf('formulier-b2b') > -1) art = 'anfrage';
    if (!art || !BK_ADS[art]) return;
    gtag('event', 'conversion', { send_to: BK_ADS.id + '/' + BK_ADS[art], transport_type: 'beacon' });
  });

  /* ---------- Eigener Zähler ohne Cookies (Dashboard reports.plaseo.de/battlekart) ----------
     Wie index.html: speichert nichts im Browser, schickt keine Klick-ID, der Server legt nur Summen je Tag ab.
     SEITE: Die Annahmestelle (reports.plaseo.de/eingang/klick) hat kein Feld für die Seite. Sie unterscheidet
     nur über »anlass« (leer = Startseite, sonst die ?anlass=-Variante der Anzeige). Unterseiten schicken deshalb
     ihren Pfad als anlass, z. B. "/gutschein/", und landen so nicht in den Zahlen der Startseite. */
  var ZAEHLER = 'https://reports.plaseo.de/eingang/klick';
  function quelle() {
    if (q.get('utm_source')) return q.get('utm_source');
    if (q.get('gclid') || q.get('gbraid') || q.get('wbraid')) return 'google';
    var r = document.referrer;
    if (!r) return 'direkt';
    try { r = new URL(r).hostname; } catch (e) { return 'verweis'; }
    if (/(^|\.)google\./.test(r)) return 'google-suche';
    if (/instagram|facebook|tiktok/.test(r)) return 'social';
    if (/battlekart\.com$/.test(r)) return 'battlekart.com';
    return r === location.hostname ? 'intern' : 'verweis';
  }
  var herkunft = quelle();
  /* Echtheit: automatisierte Browser zählen nicht. Jede Aktion zählt höchstens einmal je Seitenaufruf. */
  var robot = navigator.webdriver === true, schonGezaehlt = {};
  function zaehle(art, cta) {
    if (robot || schonGezaehlt[art]) return;
    schonGezaehlt[art] = true;
    try {
      var d = JSON.stringify({ art: art, cta: cta || '', quelle: herkunft, kampagne: q.get('utm_campaign') || '',
        gruppe: q.get('utm_content') || '', keyword: q.get('utm_term') || '', anlass: seite,
        gclid: (q.get('gclid') || q.get('gbraid') || q.get('wbraid')) ? 1 : 0 });
      if (navigator.sendBeacon) navigator.sendBeacon(ZAEHLER, new Blob([d], { type: 'text/plain' }));
      else fetch(ZAEHLER, { method: 'POST', body: d, keepalive: true, mode: 'no-cors' });
    } catch (e) {}
  }
  zaehle('besuch');
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || !e.isTrusted) return;
    var href = a.getAttribute('href') || '', art = null;
    if (a.classList.contains('js-book')) art = 'buchen';
    else if (href.indexOf('tel:') === 0) art = 'anruf';
    else if (href.indexOf('formulier-b2b') > -1) art = 'anfrage';
    else if (href.indexOf('google.com/maps') > -1) art = 'route';
    else if (href.indexOf('giftcards') > -1) art = 'gutschein';
    else if (href.indexOf('mailto:') === 0) art = 'mail';
    if (art) zaehle(art, a.dataset.cta);
  });

  /* ---------- Header + mobile Buchungsleiste ---------- */
  /* Ohne Hero erscheint die Leiste nach einer halben Bildschirmhöhe. Hat der Inhalt einen #hero-cta
     (wie die Startseite), erscheint sie wie dort, sobald diese Buttons aus dem Bild gescrollt sind. */
  var header = $('header'), bar = $('bookbar'), heroCta = $('hero-cta');
  function onScroll() {
    if (header) header.classList.toggle('is-solid', window.scrollY > 24);
    if (bar) bar.classList.toggle('is-visible', heroCta ? heroCta.getBoundingClientRect().bottom < 0 : window.scrollY > window.innerHeight * 0.5);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  onScroll();
})();

/* ---------- Öffnungszeiten: "Heute geöffnet bis …" (Uhrzeit Europe/Berlin) ----------
   Füllt im Inhalt <span id="today-open"></span> bzw. <span id="hero-open"></span>, wenn vorhanden (wie index.html). */
(function () {
  // 0 = Sonntag … 6 = Samstag: [öffnet, schließt] in Stunden (Google-Profil, Stand 16.10.2026)
  var OPEN = { 0: [10, 21], 1: [10, 21], 2: [10, 21], 3: [10, 21], 4: [10, 21], 5: [15, 22], 6: [10, 22] };
  var a = document.getElementById('hero-open'), b = document.getElementById('today-open');
  if (!a && !b) return;
  var now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Berlin' }));
  var o = OPEN[now.getDay()], h = now.getHours() + now.getMinutes() / 60, txt = '';
  if (o && h >= o[0] && h < o[1]) txt = 'Heute geöffnet bis ' + o[1] + ' Uhr · ';
  else if (o && h < o[0]) txt = 'Heute ab ' + o[0] + ' Uhr geöffnet · ';
  if (!txt) return;
  if (a) a.textContent = txt;
  if (b) { b.textContent = txt.replace(' · ', '') + ' · '; b.style.fontWeight = '800'; }
})();
</script>

<!-- ================= COOKIE-BANNER (beide Knöpfe gleich stark, wie von Datenschutzbehörden gefordert) ================= -->
<div class="consent" id="consent" role="dialog" aria-live="polite" aria-label="Cookie-Einstellungen" hidden>
  <p>Dürfen wir mit Cookies von Google messen, ob unsere Anzeigen zu Buchungen führen? <a href="https://www.battlekart.com/de/privacy-policy" target="_blank" rel="noopener">Mehr</a></p>
  <div class="consent__btns">
    <button type="button" data-consent="denied">Ablehnen</button>
    <button type="button" data-consent="granted">Akzeptieren</button>
  </div>
</div>
<script>
(function () {
  var box = document.getElementById('consent');
  if (!box) return;
  var saved = null; try { saved = localStorage.getItem('bk_consent'); } catch (e) {}
  if (!saved) box.hidden = false;
  box.querySelectorAll('[data-consent]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-consent');
      try { localStorage.setItem('bk_consent', v); } catch (e) {}
      gtag('consent', 'update', { ad_storage: v, ad_user_data: v, ad_personalization: v, analytics_storage: v });
      if (v === 'granted') bkLoadTag();
      box.hidden = true;
    });
  });
  document.querySelectorAll('[data-consent-open]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); box.hidden = false; });
  });
})();
</script>
